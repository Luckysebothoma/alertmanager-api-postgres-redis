version: "3.8"

services:
  api:
    image: 192.168.0.140:5000/alertmanager-forecast-api:latest-prd
    ports:
      - "${API_PORT}:4400"
    environment:
      PORT: "4400"
      PG_HOST: 192.168.0.140
      PG_PORT: "8067"
      PG_USER: alertm
      PG_DATABASE: alertmanager
      PG_PASSWORD_FILE: /run/secrets/app_db_password
      PG_PASSWORD: ${PG_PASS}
      REDIS_HOST: "192.168.0.140"
      REDIS_PORT: "6390"
    secrets:
      - app_db_password
    env_file:
       - .env
    networks:
      - obs-network
      - databases
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "require(\"http\").get(\"http://localhost:4400/health\",r=>process.exit(r.statusCode===200?0:1)).on(\"error\",()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  obs-network:
    external: true
  databases:
    external: true

volumes:
  pg_data:
  redis_data:

secrets:
  pg_root_password:
    file: ./secrets/pg_root_password.txt
  app_db_password:
    file: ./secrets/app_db_password.txt
  monitoring_db_password:
    file: ./secrets/monitoring_db_password.txt
  backup_db_password:
    file: ./secrets/backup_db_password.txt
